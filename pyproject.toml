[project]
name = "writing-process-lab"
version = "0.4.0"
description = "Offline writing-process simulator and research lab (all simulated output is labeled synthetic)"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wpl = ["storage/migrations/*.sql", "lab/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E731", "E741", "B905"]
